name: Sonata Release (auto from dl.sonata.skin)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sonata-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 拉取版本信息
        run: |
          curl -fsSL "https://dl.sonata.skin/version.json" -o version.json
          python3 - <<'PY'
          import json
          v = json.load(open('version.json'))
          u = v.get('update', v)
          with open('env.txt', 'w') as f:
              f.write(f"VERSION_NAME={u.get('versionName')}\n")
              f.write(f"FILE_NAME={u.get('fileName')}\n")
              f.write("NOTES=" + u.get('notes', '').replace('\n', ' | ') + "\n")
          PY
          cat env.txt >> "$GITHUB_ENV"

      - name: 检查 Release 与根目录状态
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION_NAME} 已存在，跳过创建"
          else
            echo "need_release=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION_NAME} 不存在，需要创建"
          fi
          if [ -f "${FILE_NAME}" ]; then
            echo "need_root=false" >> "$GITHUB_OUTPUT"
            echo "根目录已有 ${FILE_NAME}，跳过同步"
          else
            echo "need_root=true" >> "$GITHUB_OUTPUT"
            echo "根目录缺少 ${FILE_NAME}，需要同步"
          fi

      - name: 下载并校验 APK
        if: steps.check.outputs.need_release == 'true' || steps.check.outputs.need_root == 'true'
        run: |
          curl -fsSL "https://dl.sonata.skin/${FILE_NAME}" -o "${FILE_NAME}"
          unzip -t "${FILE_NAME}" >/dev/null
          echo "已下载并校验：$(stat -c%s "${FILE_NAME}") 字节"

      - name: 生成固定名副本
        if: steps.check.outputs.need_release == 'true'
        run: cp "${FILE_NAME}" Sonata-latest-arm64-lite.apk

      - name: 创建 Release 并上传
        if: steps.check.outputs.need_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Sonata v${{ env.VERSION_NAME }}
          body: ${{ env.NOTES }}
          files: |
            ${{ env.FILE_NAME }}
            Sonata-latest-arm64-lite.apk

      - name: 同步到仓库根目录
        if: steps.check.outputs.need_root == 'true'
        run: |
          shopt -s nullglob
          for f in Sonata-*.apk; do
            if [ "$f" != "${FILE_NAME}" ] && [ "$f" != "Sonata-latest-arm64-lite.apk" ]; then
              git rm -q --ignore-unmatch "$f"
            fi
          done
          git add "${FILE_NAME}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update APK to v${VERSION_NAME} arm64 lite"
          git pull --rebase --autostash
          git push
