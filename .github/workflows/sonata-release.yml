name: Sonata Release (auto from dl.sonata.skin)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sonata-release]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sonata-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取版本信息
        run: |
          curl -fsSL "https://dl.sonata.skin/version.json?t=$(date +%s)" -o version.json
          python3 - <<'PY'
          import json
          v = json.load(open('version.json'))
          u = v.get('update', v)
          with open('env.txt', 'w') as f:
              f.write(f"VERSION_NAME={u.get('versionName')}\n")
              f.write(f"FILE_NAME={u.get('fileName')}\n")
              f.write("NOTES=" + u.get('notes', '').replace('\n', ' | ') + "\n")
          PY
          cat env.txt >> "$GITHUB_ENV"

      - name: 检查 Release 状态
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION_NAME} 已存在，跳过创建"
            if gh release view "v${VERSION_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets \
                 --jq '.assets[].name' | grep -qx "Sonata-latest-arm64-lite.apk"; then
              echo "need_stable=false" >> "$GITHUB_OUTPUT"
              echo "固定名附件已存在"
            else
              echo "need_stable=true" >> "$GITHUB_OUTPUT"
              echo "固定名附件缺失，需要补传"
            fi
          else
            echo "need_release=true" >> "$GITHUB_OUTPUT"
            echo "need_stable=false" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION_NAME} 不存在，需要创建"
          fi

      - name: 下载并校验 APK
        if: steps.check.outputs.need_release == 'true' || steps.check.outputs.need_stable == 'true'
        run: |
          curl -fsSL "https://dl.sonata.skin/${FILE_NAME}?t=$(date +%s)" -o "${FILE_NAME}"
          unzip -t "${FILE_NAME}" >/dev/null
          echo "已下载并校验：$(stat -c%s "${FILE_NAME}") 字节"

      - name: 生成固定名副本
        if: steps.check.outputs.need_release == 'true' || steps.check.outputs.need_stable == 'true'
        run: cp "${FILE_NAME}" Sonata-latest-arm64-lite.apk

      - name: 创建 Release 并上传
        if: steps.check.outputs.need_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Sonata v${{ env.VERSION_NAME }}
          body: ${{ env.NOTES }}
          files: |
            ${{ env.FILE_NAME }}
            Sonata-latest-arm64-lite.apk

      - name: 补传固定名附件
        if: steps.check.outputs.need_stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION_NAME}" Sonata-latest-arm64-lite.apk --repo "${GITHUB_REPOSITORY}" --clobber
